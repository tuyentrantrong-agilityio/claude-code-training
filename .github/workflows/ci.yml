name: CI

on:
  push:
    branches: [main, practice]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the commit check needs the history back to the base branch
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run every test suite
        run: python .claude/skills/run-tests/run_tests.py
      # Lint every committed kickoff folder, so a ticket cannot be merged in a broken format.
      - name: Lint kickoff folders
        run: |
          shopt -s nullglob
          for folder in intent/20*/; do
            python scripts/lint_tickets.py "$folder"
          done
      - name: Check commits against CLAUDE.md
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          python .claude/skills/review-checklist/check_branch.py "origin/${{ github.base_ref }}"
