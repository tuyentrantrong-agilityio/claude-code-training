repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: detect-private-key

  - repo: local
    hooks:
      - id: backend-ruff-check
        name: backend ruff check
        entry: uv run --directory backend ruff check .
        language: system
        pass_filenames: false
        files: ^backend/
      - id: backend-ruff-format
        name: backend ruff format --check
        entry: uv run --directory backend ruff format --check .
        language: system
        pass_filenames: false
        files: ^backend/
      - id: backend-mypy
        name: backend mypy
        entry: uv run --directory backend mypy
        language: system
        pass_filenames: false
        files: ^backend/
      - id: frontend-prettier
        name: frontend prettier check
        entry: npm --prefix frontend run format:check
        language: system
        pass_filenames: false
        files: ^frontend/
      - id: frontend-eslint
        name: frontend eslint
        entry: npm --prefix frontend run lint
        language: system
        pass_filenames: false
        files: ^frontend/
      - id: backend-pytest
        name: backend pytest
        entry: uv run --directory backend pytest
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: frontend-vitest
        name: frontend vitest
        entry: npm --prefix frontend run test
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
